<text class="th" x="226" y="73" text-anchor="middle" dominant-baseline="central" fill="#412402">DI bits</text>
<text class="ts" x="226" y="91" text-anchor="middle" dominant-baseline="central">density + phase</text>
<rect x="302" y="55" width="120" height="52" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text class="th" x="362" y="73" text-anchor="middle" dominant-baseline="central" fill="#085041">600-cell</text>
<text class="ts" x="362" y="91" text-anchor="middle" dominant-baseline="central">120 GP lattice</text>
<rect x="438" y="55" width="120" height="52" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="498" y="73" text-anchor="middle" dominant-baseline="central" fill="#26215C">Nexus</text>
<text class="ts" x="498" y="91" text-anchor="middle" dominant-baseline="central">global constraint</text>
