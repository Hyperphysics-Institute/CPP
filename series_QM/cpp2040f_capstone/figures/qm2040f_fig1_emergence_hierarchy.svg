<text class="ts" x="30" y="157" fill="#888">2040a</text>
<rect x="30" y="158" width="295" height="52" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="177" y="178" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Schrödinger equation</text>
<text class="ts" x="177" y="196" text-anchor="middle" dominant-baseline="central">iℏ∂ψ/∂t = Hψ — from hopping</text>
<text class="ts" x="342" y="157" fill="#888">C3</text>
<rect x="342" y="158" width="186" height="52" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="th" x="435" y="178" text-anchor="middle" dominant-baseline="central" fill="#412402">Born rule</text>
<text class="ts" x="435" y="196" text-anchor="middle" dominant-baseline="central">P = ρ_bit = |ψ|²</text>
<path d="M 340,210 L 340,230" fill="none" stroke="#ccc" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="30" y="242" fill="#888">2040b</text>
<rect x="30" y="244" width="620" height="52" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text class="th" x="340" y="264" text-anchor="middle" dominant-baseline="central" fill="#085041">Superposition and interference</text>
<text class="ts" x="340" y="282" text-anchor="middle" dominant-baseline="central">ψ(D) = Σ A₀ e^(iφ_k) — path integral on 600-cell</text>
<path d="M 340,296 L 340,316" fill="none" stroke="#ccc" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="30" y="328" fill="#888">2040c</text>
<rect x="30" y="330" width="620" height="52" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="350" text-anchor="middle" dominant-baseline="central" fill="#26215C">Entanglement and Bell violation</text>
<text class="ts" x="340" y="368" text-anchor="middle" dominant-baseline="central">Nexus maintains |Ψ⁻⟩ → |CHSH| = 2√2, no signaling</text>
<path d="M 340,382 L 340,402" fill="none" stroke="#ccc" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="30" y="414" fill="#888">2040d</text>
<rect x="30" y="416" width="620" height="52" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="th" x="340" y="436" text-anchor="middle" dominant-baseline="central" fill="#4A1B0C">Measurement = DP Sea decoherence</text>
<text class="ts" x="340" y="454" text-anchor="middle" dominant-baseline="central">Lindblad from DP bath · pointer basis = SSV eigenstates</text>
<path d="M 340,468 L 340,488" fill="none" stroke="#ccc" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="30" y="500" fill="#888">2040e</text>
<rect x="30" y="502" width="620" height="52" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
<text class="th" x="340" y="522" text-anchor="middle" dominant-baseline="central" fill="#173404">Quantum field theory</text>
<text class="ts" x="340" y="540" text-anchor="middle" dominant-baseline="central">600-cell modes · CP exclusion → fermions · finite renorm.</text>
