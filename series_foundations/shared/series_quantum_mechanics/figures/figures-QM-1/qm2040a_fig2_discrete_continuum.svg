<circle cx="195" cy="210" r="8" fill="#378ADD" stroke="#185FA5" stroke-width="0.5"/>
<circle cx="235" cy="210" r="6" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
<circle cx="275" cy="210" r="5" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<g stroke="#ccc" stroke-width="0.5" opacity="0.4">
<line x1="81" y1="120" x2="109" y2="120"/><line x1="122" y1="120" x2="146" y2="120"/>
<line x1="164" y1="120" x2="186" y2="120"/><line x1="205" y1="120" x2="228" y2="120"/>
<line x1="75" y1="126" x2="75" y2="159"/><line x1="115" y1="127" x2="115" y2="158"/>
<line x1="155" y1="129" x2="155" y2="157"/><line x1="195" y1="130" x2="195" y2="156"/>
<line x1="75" y1="171" x2="75" y2="204"/><line x1="115" y1="172" x2="115" y2="203"/>
<line x1="155" y1="173" x2="155" y2="202"/><line x1="195" y1="174" x2="195" y2="202"/>
