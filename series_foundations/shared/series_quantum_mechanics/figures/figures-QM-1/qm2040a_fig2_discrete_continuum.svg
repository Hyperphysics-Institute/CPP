<text class="ts" x="642" y="226" fill="#888">r</text>
<line x1="390" y1="88" x2="390" y2="224" stroke="#ccc" stroke-width="0.5"/>
<text class="ts" x="394" y="96" fill="#888">ψ</text>
<rect x="398" y="248" width="240" height="52" rx="5" fill="#eee" stroke="#ccc" stroke-width="0.5"/>
<text class="ts" x="518" y="266" text-anchor="middle">iℏ ∂ψ/∂t = Hψ</text>
<text class="ts" x="518" y="284" text-anchor="middle">H = −ℏ²∇²/(2m) + V</text>
<text class="ts" x="518" y="300" text-anchor="middle" fill="#888">Schrödinger equation</text>
</svg>
