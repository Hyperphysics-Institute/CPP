<circle cx="195" cy="165" r="9" fill="#185FA5" stroke="#0C447C" stroke-width="0.8"/>
<circle cx="235" cy="165" r="7" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
<circle cx="275" cy="165" r="5" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<circle cx="75"  cy="210" r="5" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
