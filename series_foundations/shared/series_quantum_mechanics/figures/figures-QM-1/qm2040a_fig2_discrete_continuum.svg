<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<style>
.t{font-family:"Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#1a1a1a}
.ts{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;fill:#555}
.th{font-family:"Helvetica Neue",Arial,sans-serif;font-size:14px;font-weight:600;fill:#1a1a1a}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="30" y="30" width="270" height="290" rx="8" fill="#f8f8f5" stroke="#ccc" stroke-width="0.5"/>
<text class="th" x="165" y="58" text-anchor="middle">Discrete lattice</text>
<text class="ts" x="165" y="76" text-anchor="middle">hopping T = ℏ²/(4mΔs²)</text>
<circle cx="75"  cy="120" r="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<circle cx="115" cy="120" r="7" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
