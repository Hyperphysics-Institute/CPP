<rect x="50" y="250" width="230" height="52" rx="5" fill="#eee" stroke="#ccc" stroke-width="0.5"/>
<text class="ts" x="165" y="268" text-anchor="middle">ψ_i(t+Δt) = ψ_i(t)</text>
<text class="ts" x="165" y="284" text-anchor="middle">− (iΔt/ℏ) H_lattice ψ</text>
<text class="ts" x="165" y="300" text-anchor="middle" fill="#888">complex hopping</text>
<path d="M 308,190 L 370,190" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="178" text-anchor="middle">Δs → 0</text>
<text class="ts" x="340" y="205" text-anchor="middle" fill="#888">continuum</text>
<rect x="378" y="30" width="272" height="290" rx="8" fill="#f8f8f5" stroke="#ccc" stroke-width="0.5"/>
<text class="th" x="514" y="58" text-anchor="middle">Continuum limit</text>
<text class="ts" x="514" y="76" text-anchor="middle">∇² = lim of lattice Laplacian</text>
<path d="M 388,220 C 410,218 430,210 450,190 C 465,174 478,155 495,140 C 508,128 520,122 530,120 C 540,118 550,122 560,132 C 572,145 578,162 588,178 C 600,198 620,215 638,220" fill="#E6F1FB" stroke="none" opacity="0.3"/>
