<text class="th" x="85" y="167" text-anchor="middle" dominant-baseline="central" fill="#412402">ρ₁₀</text>
<text class="ts" x="85" y="183" text-anchor="middle">½e^(-iφ)</text>
<text class="ts" x="85" y="73" text-anchor="middle" fill="#888">|0⟩</text>
<text class="ts" x="190" y="73" text-anchor="middle" fill="#888">|1⟩</text>
