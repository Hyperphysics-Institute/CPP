<rect x="590" y="75" width="60" height="50" rx="4" fill="#F1EFE8" stroke="#ccc" stroke-width="0.5"/>
<text class="th" x="620" y="100" text-anchor="middle" dominant-baseline="central" fill="#888">0</text>
<rect x="485" y="145" width="60" height="50" rx="4" fill="#F1EFE8" stroke="#ccc" stroke-width="0.5"/>
<text class="th" x="515" y="170" text-anchor="middle" dominant-baseline="central" fill="#888">0</text>
<text class="ts" x="555" y="240" text-anchor="middle">classical mixture</text>
<text class="ts" x="555" y="258" text-anchor="middle" fill="#888">apparent collapse</text>
<rect x="465" y="272" width="180" height="48" rx="6" fill="#eee" stroke="#1D9E75" stroke-width="0.5"/>
<text class="ts" x="555" y="289" text-anchor="middle">Nexus: global unitarity</text>
<text class="ts" x="555" y="305" text-anchor="middle" fill="#1D9E75">Tr(ρ_tot²) = 1 preserved</text>
